# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3c19c389c0a3d2bc15e10d9ea0f0c898"
name = "ire product personaliser"
application_url = "https://saitriq-product-personaliser.vercel.app"
embedded = true

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_files,read_orders,read_products,write_app_proxy,write_files,write_products"

[auth]
redirect_urls = [
  "https://saitriq-product-personaliser.vercel.app/auth/callback",
  "https://saitriq-product-personaliser.vercel.app/auth/shopify/callback",
  "https://saitriq-product-personaliser.vercel.app/api/auth/callback"
]

[app_proxy]
url = "/api/storefront"
subpath = "personalizer"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
